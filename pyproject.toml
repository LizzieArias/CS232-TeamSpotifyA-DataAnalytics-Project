[project]
name = "cs232-teamspotifya-dataanalytics-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ipykernel>=7.4.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "TC", "FA", "PLC", "PLE", "PYI"]
ignore = ["E501", "TC006"]
future-annotations = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
strict = true
