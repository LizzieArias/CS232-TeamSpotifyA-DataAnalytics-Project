[project]
name = "cs232-teamspotifya-dataanalytics-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ipykernel>=7.4.0",
    "ruff>=0.17.4",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_data_analytics"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
package = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "TC", "FA", "PLC", "PLE", "PYI"]
ignore = ["E501", "TC006"]
future-annotations = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
strict = true
